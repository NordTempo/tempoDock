name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every check before it publishes.
  workflow_call:

# A newer push supersedes a running one: only the latest commit is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: make test
      - name: Install Caddy
        run: curl -fsSL https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin caddy
      - name: Integration tests (Docker, Caddy, BuildKit)
        run: make test-integration
      # Build the UI first so the binary embeds it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: make web
      - run: make build

  # Performance budgets (docs/performance.md): binary size, CLI start-up,
  # daemon idle memory/CPU/wake-ups, API latency, UI bundle and benchmarks
  # against scripts/perf/baseline.json. Takes about three minutes, most of
  # it two 30 s idle windows and the benchmarks.
  perf:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      # Shared runners are too noisy for timing budgets: they warn here and
      # are enforced locally (make perf). Sizes, memory and allocs still fail.
      - run: make perf PERF_FLAGS=-soft-timing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Typecheck, Biome, and a stale-client check against web/openapi.json.
      - run: pnpm check
      - run: pnpm build
      - name: Generated files are committed
        run: git diff --exit-code -- .
