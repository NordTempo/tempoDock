name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Kept for callers; release.yml no longer calls it, it waits for main's
  # run of the tagged commit (scripts/release/wait-for-ci.sh).
  workflow_call:

# A newer push to a pull request cancels its running run: only the latest
# commit is checked. On main a running run always finishes, but a newer
# merge replaces one still waiting, so a burst of merges runs CI on the
# first and the last commit, not on each. Releases tag the newest commit
# on main, whose run is never dropped (scripts/release/wait-for-ci.sh).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs run on GitHub-hosted runners, free for a public repository. While
# the repository is private the repo variable CI_RUNNER points them at the
# org's self-hosted runners (label nordtempo, with a host cache volume, see
# .github/actions/setup-go); scripts/go-public.sh deletes it. A pull
# request from a fork never runs on CI_RUNNER: its code would reach the
# shared host cache that main's runs and releases build from.
# Tools from GitHub releases (golangci-lint, sqlc) come through
# scripts/ci/fetch-release.sh, which checks each against its digest and
# keeps it in the host cache when there is one.
#
# The token is read-only; perf-comment alone may write a pull request
# comment, and only for pull requests from this repository.
permissions:
  contents: read

jobs:
  # What a change touches: Go, the UI (web/), the landing page (site/), or
  # some of them; an API change is both Go and UI (scripts/ci/changes.sh).
  # The other jobs skip what a change can't affect. A skipped job counts as
  # passed, so every commit on main still gets a green run to release from.
  changes:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      go: ${{ steps.diff.outputs.go }}
      web: ${{ steps.diff.outputs.web }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        run: scripts/ci/changes.sh
        env:
          BEFORE: ${{ github.event.before }}
      # No build outputs, other binaries or files over 1 MB: what gets in
      # stays in the history for good, since release tags can't move.
      - run: scripts/ci/no-binaries.sh
        env:
          BEFORE: ${{ github.event.before }}

  # The Go checks run as parallel jobs, each with only the setup it needs.
  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go's and the UI's lint suppressions against their budget, and the
      # classification that picks the jobs (changes.sh).
      - run: scripts/ci/suppressions.sh
      - run: scripts/ci/changes_test.sh
      - run: scripts/ci/no-binaries_test.sh
      - id: go
        uses: ./.github/actions/setup-go
      - name: Install golangci-lint
        run: tar -xzf "$(scripts/ci/fetch-release.sh golangci/golangci-lint v2.15.0 golangci-lint-2.15.0-linux-amd64.tar.gz 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea)" -C "$RUNNER_TEMP" --strip-components=1 golangci-lint-2.15.0-linux-amd64/golangci-lint && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          skip-cache: ${{ steps.go.outputs.host-cache == 'true' }}
      # Go's generated files (sqlc's code, the OpenAPI specs) match the
      # source; the web job checks the UI's clients against the specs.
      - name: Install sqlc
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$(scripts/ci/fetch-release.sh sqlc-dev/sqlc v1.31.1 sqlc_1.31.1_linux_amd64.tar.gz 497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354)" -C "$RUNNER_TEMP/bin" sqlc
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generated files are committed
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated files are out of date: run make generate and commit the result."
            exit 1
          fi
      # tempoBase must not link Dock's daemon (ADR 0024); skips until
      # cmd/tempobase exists.
      - run: make tempobase-deps
      # dock must not link DuckDB (ADR 0037).
      - run: make analytics-deps
      # Dock's Caddy, its own module (ADR 0105).
      - run: make lint-caddy

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - run: make test

  # The binaries and UIs are built by perf's artifacts job, which measures
  # them, so this job only runs the integration tests.
  integration:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            go.sum
            cmd/dock-caddy/go.sum
      # Dock's Caddy, as servers run it (ADR 0105): its handlers' tests,
      # then the integration tests drive it.
      - name: Dock's Caddy
        run: |
          make test-caddy caddy-binary
          sudo install -m 0755 bin/dock-caddy /usr/local/bin/caddy
      # The analytics store's container test runs its binary (ADR 0037).
      - run: make analytics-binary VERSION=dev
      # Temp dirs under the job's workspace: the tests bind-mount them into
      # containers, and a runner's Docker daemon (a dind sidecar on Zoomies)
      # shares the workspace with the job but not its /tmp.
      - name: Integration tests (Docker, Caddy, BuildKit)
        run: make test-integration
        env:
          TMPDIR: ${{ runner.temp }}

  # The race detector on the packages with the most concurrency (deploys,
  # the event bus, SSE streams, MCP sessions). -race makes them several
  # times slower than make test (about 10 minutes on a busy runner), so
  # they run in two shards that split the tests by name
  # (scripts/race-shard.sh); every test runs in exactly one shard.
  race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: race (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - run: make test-race SHARD=${{ matrix.shard }}/2

  # Dock Analytics' store (ADR 0037): its own module with CGO and DuckDB,
  # which the root's lint and tests don't enter. The binary is built as
  # the release builds it, to check the Dockerfile.
  analytics:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: cmd/dock-analytics/go.mod
          cache-dependency-path: cmd/dock-analytics/go.sum
      - name: Install golangci-lint
        run: tar -xzf "$(scripts/ci/fetch-release.sh golangci/golangci-lint v2.15.0 golangci-lint-2.15.0-linux-amd64.tar.gz 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea)" -C "$RUNNER_TEMP" --strip-components=1 golangci-lint-2.15.0-linux-amd64/golangci-lint && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          working-directory: cmd/dock-analytics
          skip-cache: ${{ steps.go.outputs.host-cache == 'true' }}
      - run: make test-analytics
      - run: make analytics-binary

  # Performance budgets (docs/performance.md): binary size, CLI start-up,
  # daemon idle memory/CPU/wake-ups, API latency, UI bundle and benchmarks
  # against scripts/perf/baseline.json, for Dock and tempoBase, and the
  # analytics store's idle cost, dashboards and ingest. Two jobs: the Go
  # benchmarks, which need no builds, and everything else, which builds
  # the UIs and binaries (and so checks that they build). Each builds its
  # own inputs, so they run alongside the Go and web checks.
  perf-artifacts:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    # For tempoBase's check that it closes Postgres connections after use.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: perf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      # Two commits deep: HEAD^1 is the base this change is compared with
      # (a pull request's merge commit's first parent, or main before a
      # push), so the results show a budget it raises (-base-rev).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      # Shared runners are too noisy for timing budgets: they warn here and
      # are enforced locally (make perf). Sizes, memory and allocs still fail.
      # A change to the UI alone checks only what the UI moves: the
      # binaries (which embed it) and the bundles, as built and as served.
      - run: make perf-artifacts PERF_FLAGS="-soft-timing -base-rev HEAD^1 -markdown $RUNNER_TEMP/perf.md -tempobase-pg $PERF_PG_URL $UI_ONLY"
        env:
          # The throwaway service above, not a secret.
          PERF_PG_URL: postgres://postgres:perf@127.0.0.1:5432/postgres?sslmode=disable
          UI_ONLY: ${{ needs.changes.outputs.go != 'true' && '-checks binary,served-ui,ui,tempobase-binary,tempobase-ui' || '' }}
      # The results as Markdown, for the job summary and perf-comment.
      - if: ${{ !cancelled() }}
        run: if [ -f "$RUNNER_TEMP/perf.md" ]; then cat "$RUNNER_TEMP/perf.md" >> "$GITHUB_STEP_SUMMARY"; fi
      # Capped: on GitHub's 5xx the action retries for about 11 minutes
      # after the checks are done.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: perf-artifacts
          path: ${{ runner.temp }}/perf.md
          if-no-files-found: ignore
          retention-days: 3

  perf-bench:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      # Two commits deep: HEAD^1 is the base this change is compared with
      # (a pull request's merge commit's first parent, or main before a
      # push), so the results show a budget it raises (-base-rev).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-go
      # Timing warns, allocations fail (see perf-artifacts).
      - run: make perf-bench PERF_FLAGS="-soft-timing -base-rev HEAD^1 -markdown $RUNNER_TEMP/perf.md"
      - if: ${{ !cancelled() }}
        run: if [ -f "$RUNNER_TEMP/perf.md" ]; then cat "$RUNNER_TEMP/perf.md" >> "$GITHUB_STEP_SUMMARY"; fi
      # Capped: on GitHub's 5xx the action retries for about 11 minutes
      # after the checks are done.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: perf-bench
          path: ${{ runner.temp }}/perf.md
          if-no-files-found: ignore
          retention-days: 3

  # The two perf jobs' results as one comment on the pull request, updated
  # on every push. A failure or a timing warning (timing only warns here)
  # is then in front of the reviewer and the agent babysitting the PR, not
  # only in a job log. Pull requests from forks get no write token: skipped.
  perf-comment:
    needs: [changes, perf-artifacts, perf-bench]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      pull-requests: write
    steps:
      # One step per job, each into its own directory: a pattern that
      # matches a single artifact (a UI-only change skips perf-bench)
      # extracts it into path itself, where the script didn't look. A
      # missing artifact (a skipped job, GitHub's 5xx) fails only its step.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: perf-artifacts
          path: perf/perf-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.perf-bench.result != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: perf-bench
          path: perf/perf-bench
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- dock-perf -->';
            const result = { 'perf-artifacts': '${{ needs.perf-artifacts.result }}', 'perf-bench': '${{ needs.perf-bench.result }}' };
            const part = (job, title) => {
              const f = `perf/${job}/perf.md`;
              const md = fs.existsSync(f) ? fs.readFileSync(f, 'utf8')
                : result[job] === 'skipped' ? 'Skipped: the change touches no Go.'
                : result[job] === 'success' ? `No results: ${job} passed, but its results couldn't be downloaded (see this job's log).`
                : `No results: ${job} stopped before its checks ran. See its log.`;
              return `### ${title}\n\n${md}`;
            };
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `## Performance budgets\n\nFor ${sha}. Timing budgets only warn on shared runners; \`make perf\` enforces them locally. Budgets and how to read them: docs/performance.md.`,
              part('perf-artifacts', 'Binaries, daemons and UI'),
              part('perf-bench', 'Benchmarks'),
            ].join('\n\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # The UI. Its API clients are checked against the committed specs
  # (pnpm check), which lint checks against the Go source, so a change to
  # either side runs the check that can catch it.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The UI's lint suppressions against their budget (also in lint,
      # which a change to the UI alone skips).
      - run: scripts/ci/suppressions.sh
        working-directory: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Typecheck, Biome, the clients against web/openapi.json and
      # web/tempobase/openapi.json, and the recorder against its build.
      - run: pnpm check
      - run: pnpm build

  # The landing page (site/): types, Biome, a static build, and the image
  # Dock deploys it from, so a base image bump that breaks it fails here.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
          cache: true
          cache_dependency_path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: docker build .

