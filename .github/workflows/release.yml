name: release

# Pushing a v* tag runs every CI check alongside the release build
# (make release-local, see scripts/release/build.sh), then publishes a
# GitHub Release with generated notes: dock and tempobase from the same
# commit, one version (ADR 0024). Tags with a "-" (v0.2.0-rc.1) are marked
# as pre-releases, so "latest" never points at them. tempoBase's image goes
# to ghcr.io/nordtempo/tempobase, and Dock Analytics' store (ADR 0037) to
# ghcr.io/nordtempo/dock-analytics, the image a Dock of the same version runs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: make release-local VERSION="$GITHUB_REF_NAME"
      # Artifact uploads strip executable bits; tar preserves them for the
      # tempoBase image's entrypoint and the release binaries.
      - name: Archive release artifacts
        run: tar -C dist -cf "$RUNNER_TEMP/release-artifacts.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts.tar
          if-no-files-found: error
          retention-days: 1

  # Neither GitHub Releases nor GHCR may publish until every check and the
  # parallel build have succeeded. Publish the built artifacts, never rebuild.
  release:
    needs: [ci, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      packages: write
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/download-artifact@v5
        with:
          name: release-artifacts
          path: ${{ runner.temp }}
      - name: Restore release artifacts
        run: |
          mkdir dist
          tar -xf "$RUNNER_TEMP/release-artifacts.tar" -C dist
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" != *-* ]] || flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"

      # tempoBase's image (deploy/tempobase/Dockerfile) from the binaries
      # just released. Only on a v* tag, and only once the release has
      # tempoBase binaries (cmd/tempobase exists).
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('dist/tempobase-linux-amd64') != ''
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('dist/tempobase-linux-amd64') != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tempoBase image
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('dist/tempobase-linux-amd64') != ''
        run: |
          image=ghcr.io/nordtempo/tempobase
          tags=(--tag "$image:$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(--tag "$image:latest")
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --file deploy/tempobase/Dockerfile "${tags[@]}" dist

  # Dock Analytics' store (deploy/analytics/Dockerfile). It links DuckDB
  # with CGO, so each platform builds on its own runner instead of under
  # emulation, pushed by digest; analytics-image then names both under the
  # version's tag. A job of its own, so a failed build can be re-run
  # without the release.
  analytics-build:
    needs: [ci, build]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - platform: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        run: |
          docker buildx build --platform "${{ matrix.platform }}" \
            --file deploy/analytics/Dockerfile --build-arg VERSION="$GITHUB_REF_NAME" \
            --output type=image,name=ghcr.io/nordtempo/dock-analytics,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          mkdir -p "$RUNNER_TEMP/digests"
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  analytics-image:
    needs: [analytics-build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: analytics-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the version
        run: |
          image=ghcr.io/nordtempo/dock-analytics
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" \
            $(cd "$RUNNER_TEMP/digests" && printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$GITHUB_REF_NAME"
