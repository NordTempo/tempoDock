name: release

# Pushing a v* tag checks that the tagged commit passed CI on main (it
# doesn't run the checks again) alongside the release build (make
# release-local, see scripts/release/build.sh), then publishes a
# GitHub Release with generated notes: dock and tempobase from the same
# commit, one version (ADR 0024). Tags with a "-" (v0.2.0-rc.1) are marked
# as pre-releases, so "latest" never points at them. tempoBase's image goes
# to ghcr.io/nordtempo/tempobase, the public demo's (ADR 0100) to
# ghcr.io/nordtempo/dock-demo. Dock Analytics' store (ADR 0037) ships as
# dock-analytics-linux-{amd64,arm64} in the release, which a Dock of the
# same version downloads when analytics runs.
#
# SHA256SUMS is signed (SHA256SUMS.sig, ADR 0088) before anything is
# published, with RELEASE_SIGNING_KEY from the protected `release`
# environment (tags v* and main only), and every asset gets a GitHub
# build-provenance attestation (`gh attestation verify`). Running the
# workflow by hand on main is a dry run: it builds, signs and attests
# v0.0.0-dryrun.N and keeps dist/ as an artifact for a day, publishing
# nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-dryrun.{0}', github.run_number) }}

# Every job runs on GitHub-hosted runners, never a self-hosted one: a
# release must not build where other jobs leave caches behind. While the
# repository is private, the repo variables RELEASE_RUNNER and
# RELEASE_ARM_RUNNER point them at Blacksmith (GitHub-hosted runners are
# free only for public repositories); scripts/go-public.sh deletes them.

jobs:
  # The release reuses main's CI result for the tagged commit: passes if
  # ci succeeded on main for it, waits up to 40 minutes for a run still in
  # progress (the tag usually follows the merge), fails otherwise.
  ci:
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CI passed on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/wait-for-ci.sh "$GITHUB_SHA" 2400

  build:
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No GitHub caches: a release builds from clean downloads, so a cache
      # entry written by any earlier run can't end up in the binaries.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - run: make release-local VERSION="$VERSION"
      # Artifact uploads strip executable bits; tar preserves them for the
      # tempoBase image's entrypoint and the release binaries.
      - name: Archive release artifacts
        run: tar -C dist -cf "$RUNNER_TEMP/release-artifacts.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts.tar
          if-no-files-found: error
          retention-days: 1

  # Dock Analytics' store (deploy/analytics/Dockerfile). It links DuckDB
  # with CGO, so each platform builds on its own runner, in Debian 12 like
  # the base image the store runs on.
  analytics:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ${{ vars.RELEASE_RUNNER || 'ubuntu-24.04' }}
          - arch: arm64
            runner: ${{ vars.RELEASE_ARM_RUNNER || 'ubuntu-24.04-arm' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dock-analytics-linux-${{ matrix.arch }}
        run: |
          docker build -f deploy/analytics/Dockerfile --target binary \
            --build-arg VERSION="$VERSION" --output type=local,dest=out .
          test -x "out/dock-analytics-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analytics-${{ matrix.arch }}
          path: out/dock-analytics-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # Neither GitHub Releases nor GHCR may publish until main's CI and the
  # parallel builds have succeeded. Publish the built artifacts, never
  # rebuild.
  release:
    needs: [ci, build, analytics]
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-24.04' }}
    # The signing key lives in this environment's secrets.
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: analytics-*
          merge-multiple: true
          path: ${{ runner.temp }}/analytics
      # The store's binaries join the release and its SHA256SUMS, which
      # Dock checks them against before it runs one.
      - name: Restore release artifacts
        run: |
          mkdir dist
          tar -xf "$RUNNER_TEMP/release-artifacts.tar" -C dist
          (cd dist && sha256sum --check SHA256SUMS)
          cp "$RUNNER_TEMP"/analytics/dock-analytics-linux-* dist/
          (cd dist && sha256sum dock-analytics-linux-* >> SHA256SUMS && sha256sum --check SHA256SUMS)
      # The signer checks its signature against the keys in this commit's
      # internal/update, so a signing key dock doesn't trust stops the
      # release here. The key reaches this step only, through its env.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./scripts/release/sign dist "$VERSION"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" != *-* ]] || flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"
      # `brew install nordtempo/tap/dock`: the tap's formula points at this
      # release's dock-cli builds, with their SHA-256 from the SHA256SUMS
      # signed above. Not for pre-releases. HOMEBREW_TAP_TOKEN can write to
      # NordTempo/homebrew-tap only; until it is set, the tap keeps its
      # formula and this step says so.
      - name: Update the Homebrew tap
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN isn't set; NordTempo/homebrew-tap keeps its formula"
            exit 0
          fi
          scripts/release/brew-formula.sh "$VERSION" dist/SHA256SUMS > "$RUNNER_TEMP/dock.rb"
          path=repos/NordTempo/homebrew-tap/contents/Formula/dock.rb
          sha="$(gh api "$path" --jq .sha 2>/dev/null || true)"
          gh api -X PUT "$path" -f message="feat: dock $VERSION" -f content="$(base64 -w0 < "$RUNNER_TEMP/dock.rb")" ${sha:+-f sha="$sha"} > /dev/null
      - name: Keep the dry run's dist
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-dist
          path: dist
          retention-days: 1

      # tempoBase's image (deploy/tempobase/Dockerfile) from the binaries
      # just released. Only on a v* tag, and only once the release has
      # tempoBase binaries (cmd/tempobase exists).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tempoBase image
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('dist/tempobase-linux-amd64') != ''
        run: |
          image=ghcr.io/nordtempo/tempobase
          tags=(--tag "$image:$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(--tag "$image:latest")
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --file deploy/tempobase/Dockerfile "${tags[@]}" dist

      # The public demo's image (deploy/demo/Dockerfile, ADR 0100): the
      # dock binaries just released with dock-demo, built from the
      # repository with dist/ in it. Only on a v* tag.
      - name: Publish the demo image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image=ghcr.io/nordtempo/dock-demo
          tags=(--tag "$image:$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(--tag "$image:latest")
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --file deploy/demo/Dockerfile "${tags[@]}" .

      # NordTempo/deploy-action, the GitHub Action's own repository (ADR
      # 0094), follows contrib/github-action: a new minor version, and v0
      # moved to it, when the directory changed. Last, so a failure here
      # leaves the rest of the release done. Not for pre-releases.
      # DEPLOY_ACTION_TOKEN can write that repository's contents and
      # workflows only; until it is set, the action stays as it is and
      # this step says so.
      - name: Sync the GitHub Action
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_ACTION_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::DEPLOY_ACTION_TOKEN isn't set; NordTempo/deploy-action keeps its version"
            exit 0
          fi
          gh auth setup-git
          scripts/release/sync-action.sh "$VERSION"
