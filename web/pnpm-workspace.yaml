# openapi-typescript declares typescript ^5.x but works with 6.x, the last
# release with the JS compiler API it needs (TypeScript 7 is native-only).
# Glide Data Grid 6.0.3 (the data panel's grid) declares React ^18 but runs
# on 19.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
    '@glideapps/glide-data-grid>react': '19'
    '@glideapps/glide-data-grid>react-dom': '19'
# Linaria (pulled in by Glide Data Grid) pins minimatch 9, which has a
# denial-of-service advisory (GHSA-g3hv-75wg-m249) fixed only in 11. Linaria
# only calls minimatch at build time, and 11 keeps the same named export.
overrides:
  '@linaria/react>minimatch': ^11.0.1
  '@linaria/utils>minimatch': ^11.0.1
