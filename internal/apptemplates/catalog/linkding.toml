name = "linkding"
title = "linkding"
summary = "Bookmarks with tags, search and archiving"
category = "personal"
website = "https://linkding.link"
license = "MIT"
revision = 1
main = "app"
domain = true
notes = "Sign in with the admin user and password you chose."

[[inputs]]
  key = "LD_SUPERUSER_NAME"
  label = "Admin user"
  kind = "text"
  default = "admin"

[[inputs]]
  key = "LD_SUPERUSER_PASSWORD"
  label = "Admin password"
  kind = "secret"

[[services]]
  name = "app"
  image = "sissbruecker/linkding:1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522"
  track = '^\d+\.\d+\.\d+$'
  port = 9090
  health_check_path = "/health"
  memory_mb = 256
  volumes = [{ name = "data", mount_path = "/etc/linkding/data" }]
  [services.values]
    LD_CSRF_TRUSTED_ORIGINS = "https://${{app.DOCK_PUBLIC_DOMAIN}}"
