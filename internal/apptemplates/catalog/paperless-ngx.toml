name = "paperless-ngx"
title = "Paperless-ngx"
summary = "Scans, OCRs and files your documents"
category = "docs"
website = "https://docs.paperless-ngx.com"
license = "GPL-3.0"
revision = 1
main = "app"
domain = true
notes = "Sign in with the admin user and password you chose."

[[inputs]]
  key = "PAPERLESS_ADMIN_USER"
  label = "Admin user"
  kind = "text"
  default = "admin"

[[inputs]]
  key = "PAPERLESS_ADMIN_PASSWORD"
  label = "Admin password"
  kind = "secret"

[[inputs]]
  key = "PAPERLESS_OCR_LANGUAGE"
  label = "OCR language"
  kind = "text"
  default = "eng"
  help = "Tesseract codes joined by +, such as eng+nor"

[[services]]
  name = "app"
  image = "ghcr.io/paperless-ngx/paperless-ngx:3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84"
  track = '^\d+\.\d+\.\d+$'
  port = 8000
  health_check_timeout_seconds = 300
  memory_mb = 1536
  depends_on = ["db", "redis"]
  volumes = [{ name = "data", mount_path = "/usr/src/paperless/data" }, { name = "media", mount_path = "/usr/src/paperless/media" }]
  generate = { PAPERLESS_SECRET_KEY = "hex:32" }
  [services.values]
    PAPERLESS_URL = "https://${{app.DOCK_PUBLIC_DOMAIN}}"
    PAPERLESS_REDIS = "${{redis.REDIS_URL}}"
    PAPERLESS_DBHOST = "${{db.DOCK_PRIVATE_DOMAIN}}"
    PAPERLESS_DBNAME = "${{db.POSTGRES_DB}}"
    PAPERLESS_DBUSER = "${{db.POSTGRES_USER}}"
    PAPERLESS_DBPASS = "${{db.POSTGRES_PASSWORD}}"

[[services]]
  name = "db"
  template = "postgres"

[[services]]
  name = "redis"
  template = "redis"
