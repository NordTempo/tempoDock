name = "grafana"
title = "Grafana"
summary = "Dashboards for metrics, logs and traces"
category = "monitoring"
website = "https://grafana.com/oss/grafana"
license = "AGPL-3.0"
revision = 1
main = "app"
domain = true
notes = "Sign in as admin with the password you chose."

[[inputs]]
  key = "GF_SECURITY_ADMIN_PASSWORD"
  label = "Admin password"
  kind = "secret"

[[services]]
  name = "app"
  image = "grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf"
  track = '^\d+\.\d+\.\d+$'
  port = 3000
  health_check_path = "/api/health"
  memory_mb = 256
  volumes = [{ name = "data", mount_path = "/var/lib/grafana" }]
  [services.values]
    GF_SERVER_ROOT_URL = "https://${{app.DOCK_PUBLIC_DOMAIN}}"
    GF_SECURITY_ADMIN_USER = "admin"
    GF_ANALYTICS_REPORTING_ENABLED = "false"
