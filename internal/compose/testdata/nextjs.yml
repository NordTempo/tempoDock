# A Next.js app, a background worker built from the same source, and Postgres.
x-app: &app
  build: ./web
  env_file: ./web/.env.production
  depends_on:
    postgres:
      condition: service_healthy

services:
  web:
    build:
      context: ./web
      dockerfile: docker/Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    image: acme/web:latest
    env_file:
      - ./web/.env.production
      - path: ./web/.env.local
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?schema=public
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      STRIPE_SECRET_KEY:
      PORT: 3000
    expose:
      - 3000
    ports:
      - 3000:3000
    depends_on:
      - postgres
      - migrate
    healthcheck:
      test: wget -qO- http://127.0.0.1:3000/api/health || exit 1
      start_period: 1m
      interval: 15s

  worker:
    <<: *app
    command: ["node", "dist/worker.js", "--queue", "default emails"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    mem_limit: 1g

  migrate:
    <<: *app
    x-note: runs once before web starts
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
    restart: "no"

  postgres:
    image: docker.io/library/postgres:17.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
