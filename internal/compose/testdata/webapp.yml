# A web app with Postgres and Redis, in the style of most self-hosted apps' docs.
name: Linkding_Stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkding
      POSTGRES_PASSWORD: s3cr3t-db-pass
      POSTGRES_DB: linkding
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkding"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    image: ghcr.io/example/linkding:1.36
    container_name: linkding
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://linkding:s3cr3t-db-pass@db:5432/linkding?sslmode=disable
      - REDIS_URL=redis://cache:6379/0
      - DB_PASSWORD=s3cr3t-db-pass
      - SECRET_KEY=change-me-to-something-long
      - DEBUG=false
      - ALLOWED_HOSTS=*
    ports:
      - "9090:9090"
    volumes:
      - uploads:/etc/linkding/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  db_data:
  redis_data:
  uploads:
