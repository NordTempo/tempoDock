version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - bodyclose
    - nolintlint
  settings:
    # A //nolint names its linter and says why (scripts/ci/suppressions.sh
    # keeps their number on a budget).
    nolintlint:
      require-specific: true
      require-explanation: true
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/NordTempo/tempoDock
