# Local development config: `make dev` runs the daemon with the in-memory
# fake runtime (DOCK_FAKE_RUNTIME=1), so no Docker, Caddy or BuildKit is
# needed. State lives in ./.data (gitignored); delete it to start over.
# For demo content, DOCK_FAKE_LOGS names a file of log lines every
# container starts with ("E " lines go to stderr), and DOCK_FAKE_SPOOL a
# file of analytics events (JSON lines, the ingest's format) added once
# the analytics store runs, and DOCK_FAKE_SPANS one of spans (analytics.Span
# JSON lines) once tracing is on. DOCK_FAKE_PENDING_DOMAINS (comma-separated
# hostnames) keeps those domains waiting for DNS. DOCK_FAKE_FINDINGS names a
# file of vulnerability findings (JSON lines, node.Finding) every scanned
# image has. DOCK_FAKE_DIAL=host:port sends database connections to a local
# Postgres, MySQL or Redis, for the Data panel.
data_dir = ".data"
listen = "127.0.0.1:7070"
internal_listen = "127.0.0.1:7071"
public_ip = "127.0.0.1"
base_domain = "localhost"

[caddy]
admin_socket = ".data/caddy-admin.sock"
http_port = 18080
https_port = 18443
disable_tls = true
